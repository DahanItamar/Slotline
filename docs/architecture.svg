<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Architecture: a React SPA talks over HTTP and SSE to a single Fastify process, which talks to Postgres over two pooled connections and one LISTEN connection. Postgres holds the exclusion constraint, row-level security and NOTIFY on commit.">
  <style>
    .card { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1.5; }
    .pg   { fill: #f4f7fd; stroke: #c6d4ee; stroke-width: 1.5; }
    .t    { font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; fill: #16181d; }
    .h    { font-size: 15px; font-weight: 650; }
    .b    { font-size: 12.5px; fill: #5b626e; }
    .m    { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; fill: #2f5bd7; }
    .k    { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: #16181d; }
    .lbl  { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; fill: #5b626e; }
    .ln   { stroke: #9aa3b2; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#fbfbfc"/>

  <!-- Browser -->
  <rect class="card" x="40" y="24" width="290" height="72" rx="9"/>
  <text class="t h" x="60" y="52">Browser · React SPA</text>
  <text class="t b" x="60" y="74">Vite · TanStack Query · Luxon</text>

  <!-- arrows down to API -->
  <path class="ln" d="M120,96 L120,150" marker-end="url(#a)"/>
  <path class="ln" d="M250,96 L250,150" marker-end="url(#a)"/>
  <text class="lbl" x="130" y="120">HTTP / JSON</text>
  <text class="lbl" x="260" y="120">SSE stream</text>
  <text class="lbl" x="130" y="136">session cookie</text>
  <text class="lbl" x="260" y="136">Last-Event-ID</text>

  <!-- API -->
  <rect class="card" x="40" y="150" width="580" height="128" rx="9"/>
  <text class="t h" x="60" y="178">Fastify · one process, one origin</text>
  <text class="k" x="60" y="208">routes/  →  services/  →  domain/  ←  db/</text>
  <text class="t b" x="60" y="228">domain/ imports no framework and no database client</text>
  <text class="k" x="60" y="252">realtime/  — SSE hub + the one LISTEN connection</text>

  <!-- SPA served note -->
  <rect class="card" x="640" y="150" width="200" height="128" rx="9"/>
  <text class="t h" x="660" y="178">In production</text>
  <text class="t b" x="660" y="200">the same process also</text>
  <text class="t b" x="660" y="218">serves the built SPA —</text>
  <text class="t b" x="660" y="236">so “same origin” is true,</text>
  <text class="t b" x="660" y="254">not aspirational.</text>

  <!-- arrows down to Postgres -->
  <path class="ln" d="M130,278 L130,336" marker-end="url(#a)"/>
  <path class="ln" d="M330,278 L330,336" marker-end="url(#a)"/>
  <path class="ln" d="M530,278 L530,336" marker-end="url(#a)"/>
  <text class="lbl" x="52" y="300">pool: app_tenant</text>
  <text class="lbl" x="52" y="316">RLS enforced</text>
  <text class="lbl" x="250" y="300">pool: app_auth</text>
  <text class="lbl" x="250" y="316">pre-auth only</text>
  <text class="lbl" x="452" y="300">LISTEN</text>
  <text class="lbl" x="452" y="316">booking_events</text>

  <!-- Postgres -->
  <rect class="pg" x="40" y="336" width="800" height="110" rx="9"/>
  <text class="t h" x="60" y="364">Postgres 16</text>
  <text class="m" x="60" y="392">EXCLUDE USING gist</text>
  <text class="t b" x="215" y="392">— the double-booking guarantee</text>
  <text class="m" x="60" y="414">ROW LEVEL SECURITY</text>
  <text class="t b" x="215" y="414">— the tenant boundary</text>
  <text class="m" x="60" y="436">NOTIFY on commit</text>
  <text class="t b" x="215" y="436">— the live-update fan-out, never announcing a rollback</text>
</svg>
